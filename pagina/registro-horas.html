<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <title>Registro de Horas</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                background: #f4f6f8;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }

            .wrap {
                width: min(720px, 94vw);
                margin: 28px auto;
            }

            .card {
                border: 1px solid #d8e0e6;
                border-radius: 12px;
                background: #fff;
                padding: 20px;
                box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
                margin-bottom: 24px;
            }

            h1 {
                margin: 0 0 8px;
                font-size: 1.35rem;
            }

            h2 {
                margin: 0 0 16px;
                font-size: 1.15rem;
            }

            p {
                margin: 0 0 14px;
                color: #4b5563;
            }

            .field {
                margin-bottom: 10px;
            }

            label {
                display: block;
                margin-bottom: 4px;
                font-size: 0.92rem;
            }

            input,
            select,
            button {
                width: 100%;
                border: 1px solid #d5dde3;
                border-radius: 8px;
                padding: 9px 10px;
                font-size: 0.95rem;
                box-sizing: border-box;
            }

            button {
                margin-top: 8px;
                border: none;
                background: #2e8322;
                color: #fff;
                font-weight: 700;
                cursor: pointer;
            }

            button:hover {
                background: #25681b;
            }

            button:disabled {
                background: #9db89a;
                cursor: not-allowed;
            }

            .status {
                margin-top: 10px;
                min-height: 20px;
                color: #7f1d1d;
            }

            .ok {
                color: #166534;
            }

            .back {
                display: inline-block;
                margin-top: 14px;
                color: #25681b;
                font-weight: 700;
                text-decoration: none;
            }

            .table-wrap {
                overflow-x: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.92rem;
            }

            th,
            td {
                text-align: left;
                padding: 8px 10px;
                border-bottom: 1px solid #e5eaef;
                white-space: nowrap;
            }

            th {
                background: #f0f4f8;
                font-weight: 600;
            }

            tfoot td {
                border-top: 2px solid #d8e0e6;
                border-bottom: none;
            }
        </style>
    </head>
    <body>
        <main class="wrap">
            <!-- Card 1: Formulario de registro -->
            <section class="card">
                <h1>Registrar horas de trabajo</h1>
                <p>
                    Selecciona la ayudantía y la semana, luego ingresa las horas
                    trabajadas.
                </p>
                <form id="horasForm">
                    <div class="field">
                        <label for="ayudantiaSelect">Ayudantía</label>
                        <select
                            id="ayudantiaSelect"
                            name="ayudantiaDescripcion"
                            required
                        ></select>
                    </div>

                    <div class="field">
                        <label for="semanaInicio"
                            >Semana (fecha de inicio)</label
                        >
                        <input
                            type="date"
                            id="semanaInicio"
                            name="semanaInicio"
                            required
                        />
                    </div>

                    <div class="field">
                        <label for="horas">Horas trabajadas</label>
                        <input
                            type="number"
                            id="horas"
                            name="horas"
                            min="0.5"
                            step="0.5"
                            required
                        />
                    </div>

                    <button type="submit" id="submitBtn">Guardar horas</button>
                    <div id="status" class="status"></div>
                </form>

                <a class="back" href="/estudiante">Volver</a>
            </section>

            <!-- Card 2: Resumen de horas registradas -->
            <section class="card">
                <h2>Mis horas registradas</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Ayudantía</th>
                                <th>Semana</th>
                                <th>Horas</th>
                                <th>Registrado</th>
                            </tr>
                        </thead>
                        <tbody id="resumenBody">
                            <tr>
                                <td colspan="4">Cargando...</td>
                            </tr>
                        </tbody>
                        <tfoot id="resumenFoot"></tfoot>
                    </table>
                </div>
            </section>
        </main>

        <script src="/utils.js"></script>
        <script>
            const form = document.getElementById("horasForm");
            const statusEl = document.getElementById("status");
            const ayudantiaSelect = document.getElementById("ayudantiaSelect");
            const semanaInicio = document.getElementById("semanaInicio");
            const horasInput = document.getElementById("horas");
            const submitBtn = document.getElementById("submitBtn");
            const resumenBody = document.getElementById("resumenBody");
            const resumenFoot = document.getElementById("resumenFoot");

            // ── Utilities ───────────────────────────────────────────────────────────────
            function formatDate(str) {
                if (!str) return "—";
                const datePart = String(str).substring(0, 10);
                const [year, month, day] = datePart.split("-");
                if (!year || !month || !day) return String(str);
                return `${day}/${month}/${year}`;
            }

            // ── Tabla de resumen ──────────────────────────────────────────────
            function renderTabla(rows) {
                if (!rows || rows.length === 0) {
                    resumenBody.innerHTML =
                        '<tr><td colspan="4">No hay registros aún.</td></tr>';
                    resumenFoot.innerHTML = "";
                    return;
                }

                resumenBody.innerHTML = rows
                    .map(
                        (row) => `
                    <tr>
                        <td>${escapeHtml(row.ayudantia_descripcion || "—")}</td>
                        <td>${formatDate(row.semana_inicio)}</td>
                        <td>${row.horas}</td>
                        <td>${formatDate(row.created_at)}</td>
                    </tr>`,
                    )
                    .join("");

                const total = rows.reduce(
                    (sum, row) => sum + Number(row.horas || 0),
                    0,
                );
                resumenFoot.innerHTML = `
                    <tr>
                        <td colspan="2"><strong>Total</strong></td>
                        <td><strong>${total}</strong></td>
                        <td></td>
                    </tr>`;
            }

            // ── Carga de datos ────────────────────────────────────────────────
            async function cargarAyudantias(email) {
                ayudantiaSelect.innerHTML =
                    '<option value="">Cargando ayudantías...</option>';
                ayudantiaSelect.disabled = true;
                submitBtn.disabled = true;

                try {
                    const response = await fetch(
                        `/api/estudiante/ayudantias-activas?email=${encodeURIComponent(email)}`,
                    );
                    const data = await response.json();
                    const lista = Array.isArray(data) ? data : [];

                    if (lista.length === 0) {
                        ayudantiaSelect.innerHTML =
                            "<option disabled>Sin ayudantías activas</option>";
                        submitBtn.disabled = true;
                    } else {
                        ayudantiaSelect.innerHTML = lista
                            .map(
                                (a) =>
                                    `<option value="${escapeHtml(a.descripcion)}">${escapeHtml(a.descripcion)}</option>`,
                            )
                            .join("");
                        ayudantiaSelect.disabled = false;
                        submitBtn.disabled = false;
                    }
                } catch (err) {
                    ayudantiaSelect.innerHTML =
                        "<option disabled>Error al cargar ayudantías</option>";
                    submitBtn.disabled = true;
                    console.error("Error en cargarAyudantias:", err);
                }
            }

            async function cargarResumen(email) {
                resumenBody.innerHTML =
                    '<tr><td colspan="4">Cargando...</td></tr>';
                resumenFoot.innerHTML = "";

                try {
                    const response = await fetch(
                        `/api/horas?email=${encodeURIComponent(email)}`,
                    );
                    const data = await response.json();
                    renderTabla(Array.isArray(data) ? data : []);
                } catch (err) {
                    resumenBody.innerHTML =
                        '<tr><td colspan="4">Error al cargar registros.</td></tr>';
                    console.error("Error en cargarResumen:", err);
                }
            }

            // ── Inicialización ────────────────────────────────────────────────
            const currentUser = getCurrentUser();

            if (!currentUser) {
                statusEl.textContent =
                    "No se pudo identificar al usuario. Vuelve a iniciar sesión.";
                ayudantiaSelect.innerHTML =
                    "<option disabled>Sin ayudantías activas</option>";
                submitBtn.disabled = true;
                resumenBody.innerHTML =
                    '<tr><td colspan="4">No hay registros aún.</td></tr>';
            } else {
                cargarAyudantias(currentUser.email);
                cargarResumen(currentUser.email);
            }

            // ── Envío del formulario ──────────────────────────────────────────
            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                statusEl.textContent = "";
                statusEl.classList.remove("ok");

                if (!currentUser) {
                    statusEl.textContent =
                        "No se pudo identificar al usuario. Vuelve a iniciar sesión.";
                    return;
                }

                const horasVal = Number(horasInput.value);
                if (!Number.isFinite(horasVal) || horasVal <= 0) {
                    statusEl.textContent =
                        "Ingresa un número de horas válido y mayor a 0.";
                    return;
                }

                const payload = {
                    nombreAyudante: currentUser.nombre,
                    emailAyudante: currentUser.email,
                    semanaInicio: semanaInicio.value,
                    horas: horasVal,
                    ayudantiaDescripcion: ayudantiaSelect.value,
                };

                try {
                    const response = await fetch("/api/horas", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload),
                    });
                    const data = await response.json();

                    if (!response.ok) {
                        statusEl.textContent =
                            data.error || "No se pudo guardar el registro.";
                        return;
                    }

                    statusEl.textContent =
                        data.message || "Horas registradas exitosamente.";
                    statusEl.classList.add("ok");
                    form.reset();
                    await cargarResumen(currentUser.email);
                } catch (err) {
                    statusEl.textContent =
                        "Error de red al guardar. Intenta nuevamente.";
                    console.error("Error al enviar horas:", err);
                }
            });
        </script>
    </body>
</html>
