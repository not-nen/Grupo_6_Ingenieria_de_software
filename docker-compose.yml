version: "3.8"
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=mydb
      # Credenciales Gmail para envío de correos
      - SMTP_USER=barcobasurero2534@gmail.com
      - SMTP_PASS=vcip hves unzw fmws

    depends_on:
      - postgres_db
    volumes:
      - ./:/app
      - /app/node_modules

  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres_data:
