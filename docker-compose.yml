version: "3.8"
services:
  app:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "npx wait-port postgres_db:5432 && npm start"]
    ports:
      - "3000:3000"
    environment:
      # Base online (Neon): `neon env pull` escribe ambas en .env (no se sube a git).
      # Vacías = Postgres local. La directa (UNPOOLED) se usa para crear/migrar el esquema.
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED:-}
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=mydb
      # Credenciales Gmail para envío de correos
      - SMTP_USER=barcobasurero2534@gmail.com
      - SMTP_PASS=vcip hves unzw fmws

    depends_on:
      - postgres_db
    volumes:
      - ./:/app
      - /app/node_modules

  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres_data:
